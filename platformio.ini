; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build OUTSIDE the Documents tree. That folder is OneDrive-synced / AV-scanned,
; which blocks fresh creation of .pio/build sub-dirs and makes the compiler fail with
; "opening dependency file <...>.cpp.d: No such file or directory" on a clean build.
; LOCALAPPDATA is local-only (and, unlike TEMP, not auto-cleaned).
; On Linux/macOS export it first, e.g.: LOCALAPPDATA=$HOME/.cache pio run
build_dir = ${sysenv.LOCALAPPDATA}/pio_build/ambit_fw_new
default_envs = ambit

; ── single image ─────────────────────────────────────────────────────────────
; One firmware serves every host at runtime by first-byte routing (ambit-1.ino
; loop()): binary FSM for the Ambyte over UART0/FFC (frozen wire, >127 framing
; bytes), the text console for the openJII app + Calibratron (bare printable
; lines), and the openJII JSON envelope ('{'/'[' first byte). Replaces the former
; ambyte/cloud build-variant pair: that split assumed the app variant would live
; on native USB-CDC, but all hosts ended up on the same UART0.
[env]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Pin the dual-OTA partition layout explicitly. This is the Arduino-ESP32 4 MB
; default (otadata + ota_0/ota_1 1.25 MB each + spiffs) the board was already
; using implicitly (naming it guarantees a future build can't silently switch
; to a single-app scheme and break OTA). SAME layout = no NVS shift, so the
; one-time bootstrap reflash preserves calibration. VERIFY a fielded unit's
; table matches before reflashing it (esptool read_flash 0x8000 0xc00).
board_build.partitions = default.csv
; Version is injected at build time by tools/version.py (semantic-release tag
; in CI, git describe locally). It feeds cmd 33/2, `hello`, and the JSON identity.
extra_scripts = pre:tools/version.py
lib_deps =
  adafruit/Adafruit BusIO
  bblanchon/ArduinoJson@^7

[env:ambit]
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 (GPIO20 RX / 21 TX)
  ; Gag ARDUHAL. setup()'s esp_log_level_set() silences IDF logging only; the
  ; Arduino ESP_LOGx macros compile to Serial.printf and were writing ASCII
  ; straight onto the protocol port. Observed on the bench: a stray frame byte
  ; made the router answer a host with
  ; "[E][ambit-1.ino:215] loop(): [INO] Unknown cmd 171" instead of protocol
  ; bytes. Nothing may emit on UART0 except an explicit console reply.
  -DCORE_DEBUG_LEVEL=0
