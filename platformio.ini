; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build OUTSIDE the Documents tree. That folder is OneDrive-synced / AV-scanned,
; which blocks fresh creation of .pio/build sub-dirs and makes the compiler fail with
; "opening dependency file <...>.cpp.d: No such file or directory" on a clean build.
; LOCALAPPDATA is local-only (and, unlike TEMP, not auto-cleaned).
build_dir = ${sysenv.LOCALAPPDATA}/pio_build/ambit_fw_new
default_envs = ambyte

; ── shared base ─────────────────────────────────────────────────────────────
[env]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Pin the dual-OTA partition layout explicitly. This is the Arduino-ESP32 4 MB
; default (otadata + ota_0/ota_1 1.25 MB each + spiffs) the board was already
; using implicitly — naming it guarantees a future build can't silently switch
; to a single-app scheme and break OTA. SAME layout = no NVS shift, so the
; one-time bootstrap reflash preserves calibration. VERIFY a fielded unit's
; table matches before reflashing it (esptool read_flash 0x8000 0xc00).
board_build.partitions = default.csv
; ArduinoJson is header-only: it is in the shared deps so the dependency finder
; resolves it across the #ifdef VARIANT_CLOUD guards, but it instantiates no code
; in the ambyte image (nothing there includes it).
lib_deps =
  adafruit/Adafruit BusIO
  bblanchon/ArduinoJson@^7

; ── Field variant: binary FSM over UART0/FFC to the ambyte (HW-verified) ─────
[env:ambyte]
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 (GPIO20 RX / 21 TX), FFC to the ambyte
  -DVARIANT_AMBYTE=1

; ── App variant: openJII LINE + JSON (CommunicationProtocolOpenJIISerial.md).
; This test HW has no native USB-C, so Serial is UART0 (GPIO20/21) — same wire as
; ambyte, just the LINE/JSON protocol. (For a future PCB with native USB, swap to
; ARDUINO_USB_MODE=1 / ARDUINO_USB_CDC_ON_BOOT=1 + USB_VID/PID/MANUFACTURER/PRODUCT.)
[env:cloud]
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 (GPIO20 RX / 21 TX)
  -DVARIANT_CLOUD=1
